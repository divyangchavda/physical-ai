# KAGGLE — tt7 with DECOY CLASSES, vocabulary B: name the depiction.
#
# Baseline finding this exists to fix (run_20260824_130923, tt6): 52% of
# "push chopper" detections land after the labels say the box is closed, and
# crops of those frames show the carton's own printed artwork — a pink panel
# reading MAKE IN INDIA with the product pictured on it. GroundingDINO grounds
# phrases: every box goes to its best-matching span among the labels it was
# GIVEN, so with no better option the printed chopper became "push chopper".
#
# Confidence cannot separate them. The printed panel scored 0.62-0.67 while
# genuine detections scored 0.41-0.55, so raising a threshold removes the real
# object first. The fix has to be a competing label, not a number.
#
# The two decoy phrases were a HYPOTHESIS, not a derived value. tt7 has now
# decided between them. The user confirmed the chopper is physically inside the
# carton before 2.0s and its own track's last observed detection is f42 (1.40s),
# so every "push chopper" detection after f42 is printed artwork — that is the
# score, with no threshold to pick:
#
#     vocabulary        real (f<=42)   print (f>42)   chopper tracks
#     baseline               15             29        f0..42, f45..57, f69..168
#     A                      14             36        worse on every count
#     B, span leak           13             21        11 print boxes leaked out
#                                                     of "push chopper" into
#                                                     classes of their own, so
#                                                     21 flattered it
#     B, leak fixed          15             28        f0..42, f99..144
#
# So B barely moves the print COUNT: 29 against 28. Its value is entirely in
# where the print lands. Baseline scattered phantom chopper detections across
# f45..168, straddling the 1.0-2.0s INSERT window; B leaves two tracks with 56
# frames of nothing between them — real f0..42 and print f99..144. That is what
# makes "the real chopper track ends and never returns" readable as the INSERT
# signal, and it is the reason to keep this file over the baseline.
#
# f99..144 is 3.30-4.80s. The user independently reported the printed artwork is
# visible on the carton face from 3.3s to 4.8s, having never seen these numbers.
#
# vlm.enabled=false — the phantom rate is measured from tracks_raw.json, which
# s04 writes. No Gemini call, so comparing vocabularies costs nothing but GPU.

output_dir: "/kaggle/working/runs/tt7_decoy_b"

frame_sampling:
  every_n_frames: 3

detector:
  backend: "groundingdino_hf"
  model: "IDEA-Research/grounding-dino-tiny"
  confidence: 0.20
  text_threshold: 0.25
  # B: name the DEPICTION itself. "picture of a push chopper" shares its head
  # noun with the real class, which is the point: the two spans compete directly
  # for the same box, and the more specific one should win on printed pixels. The decoys go LAST so the
  # four real classes keep their class_ids and the runs stay comparable.
  #
  # Both phrases are long enough that the tokenizer splits them, and the first
  # run of this file leaked 11 boxes into classes named "##on label" and
  # "chopper picture" because span resolution could not match the fragments.
  # Fixed in groundingdino_hf_detector._resolve_class; a re-run of this file is
  # what verifies it.
  text_prompt: "person . cardboard box . push chopper . dining table . picture of a push chopper . printed carton label ."
  decoy_classes: ["picture of a push chopper", "printed carton label"]
  device: "auto"
  nms_iou: 0.45
  drop_unlabeled: true

tracker:
  backend: "kalman_sparse"
  iou_threshold: 0.20
  max_age: 15
  min_hits: 3
  max_missed_detections: 5

segment:
  person_classes: ["person"]
  background_classes: ["dining table"]
  max_segment_duration_sec: 10.0

vlm:
  enabled: false
