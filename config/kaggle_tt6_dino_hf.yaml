# KAGGLE — TT6, GroundingDINO via HuggingFace transformers + Kalman sparse tracking.
#
# Use this instead of config/kaggle_tt6_dino.yaml. The IDEA-Research repo needs
# its MultiScaleDeformableAttention CUDA op compiled, which fails on Kaggle. The
# transformers port is pure PyTorch:
#
#   - no compile step
#   - no 660 MB checkpoint upload (weights come from the Hub, needs Internet ON)
#   - grounding-dino-tiny is the same Swin-T backbone as groundingdino_swint_ogc.pth
#
# It also resolves grounded text spans against the prompt vocabulary explicitly,
# so an unrecognised span lands in an `unmatched` bucket instead of silently
# becoming class 0 (= "person" here).
#
# Verified environment (probe, 2026-08-23): Tesla T4 x2, torch 2.10.0+cu128,
# transformers 5.0.0, videos at /kaggle/input/datasets/divyangchavda/pdc-videos/
#
# Usage on Kaggle:
#   python -m src.pipeline \
#       /kaggle/input/datasets/divyangchavda/pdc-videos/tt6.mp4 \
#       --config config/kaggle_tt6_dino_hf.yaml --verbose

output_dir: "/kaggle/working/runs/tt6_dino_hf"

frame_sampling:
  # Was 10. IoU association across a 10-frame gap fails for anything moving:
  # a 400px box that travels 300px between detections has IoU ~0, well under
  # tracker.iou_threshold, so the track dies and is reborn under a new id —
  # 57 tracks for 4 real objects. Stride 3 keeps consecutive boxes overlapping.
  every_n_frames: 3         # tt6 is 996 frames @ 30fps -> ~332 detection frames

detector:
  backend: "groundingdino_hf"
  model: "IDEA-Research/grounding-dino-tiny"   # or grounding-dino-base (Swin-B)
  confidence: 0.20          # box threshold; low for recall
  text_threshold: 0.25
  text_prompt: "person . cardboard box . push chopper . dining table ."
  device: "auto"
  nms_iou: 0.45             # per-class NMS; HF post-processor applies none
  drop_unlabeled: true      # discard boxes whose grounded span is empty

tracker:
  backend: "kalman_sparse"
  iou_threshold: 0.20
  max_age: 15
  # Was 1, which let a single detector flicker mint a permanent track id. At
  # stride 3 there are 3.3x more detection frames than at stride 10, so that
  # took tracks from 57 to 87 even though per-detection association improved.
  # 3 consecutive detection frames = 0.3s of evidence before an id is issued.
  min_hits: 3
  # Was 2. s04 passes the stride down and the tracker deletes after
  # max(max_age, stride * (missed + 1)) unmatched frames, so dropping the
  # stride to 3 silently cut gap tolerance from 30 frames to 15. 5 restores it
  # to 18 frames (0.6s), now that detections are dense enough for IoU to chain.
  max_missed_detections: 5

segment:
  person_classes: ["person"]
  # The table is the scene, not a manipulated object. Its box covers 60% of the
  # frame, so pairing it with the person fired proximity on every frame.
  background_classes: ["dining table"]
  max_segment_duration_sec: 10.0

vlm:
  enabled: true             # detection + tracking + segments verified; go end-to-end
  backend: "GEMINI"
  model_name: "gemini-3.1-flash-lite"
  # ~220s per segment observed. 4 segments -> ~15 min for s06 alone. Needs
  # GEMINI_API_KEY in the environment (Kaggle Secrets) and Internet ON.
  max_retries: 1            # 2 retries x 220s per failing segment is too slow
